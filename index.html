<!DOCTYPE html>
<html>
<head>
  <title>House of Ananda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background-color: #faf7f5;
  color: #2c2c2c;
}

h1, h2, h3 {
  font-family: 'Playfair Display', serif;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

/* 🔥 PREMIUM HERO (FIXED) */
.hero-premium {
  height: 60vh;
  min-height: 420px;
  background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
              url('https://images.unsplash.com/photo-1610030469983-98e550d6193c?q=80&w=1400') center/cover no-repeat;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.logo-hero {
  width: 200px;
  max-width: 80%;
  margin-bottom: 20px;
}

.tagline {
  color: white;
  font-size: 18px;
  letter-spacing: 1px;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  margin-top: 30px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  text-align: center;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-6px);
}

.image {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 14px;
  margin-bottom: 12px;
}

.thumbs {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.thumbs img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  opacity: 0.7;
}

.thumbs img:hover {
  opacity: 1;
}

.price {
  font-weight: 600;
  margin: 10px 0;
}

.btn {
  display: inline-block;
  padding: 12px 22px;
  border-radius: 30px;
  background-color: #c97b63;
  color: white;
  text-decoration: none;
}

.btn:hover {
  background-color: #a85f4a;
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 60px;
  padding: 25px;
  border-top: 1px solid #eee;
}

.footer-links span {
  margin: 0 10px;
  cursor: pointer;
  text-decoration: underline;
}

/* POPUP */
.popup {
  display: none;
  position: fixed;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.popup img {
  max-width: 90%;
}

.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 30px;
  color: white;
  cursor: pointer;
}

.left { left: 20px; }
.right { right: 20px; }

.close {
  position: absolute;
  top: 20px;
  right: 20px;
  color: white;
  font-size: 30px;
  cursor: pointer;
}

.policy-content {
  background: white;
  padding: 20px;
  border-radius: 10px;
  max-width: 500px;
}

@media (max-width: 600px) {
  .hero-premium {
    height: 50vh;
  }

  .logo-hero {
    width: 150px;
  }
}

  </style>
</head>

<body>

<!-- 🔥 HERO -->
<div class="hero-premium">
  <img src="YOUR-LOGO-LINK" class="logo-hero">
  <p class="tagline">Where tradition meets quiet luxury ✨</p>
</div>

<!-- PRODUCTS -->
<div class="container">
  <h2 style="text-align:center;">Our Sarees</h2>

  <div class="products">

    <div class="card">

      <img id="img1" 
      src="https://i.ibb.co/mVFRRMPH/IMG-4703.jpg" 
      class="image"
      onclick="openPopup(this.src, images1)">

      <div class="thumbs">
        <img src="https://i.ibb.co/mVFRRMPH/IMG-4703.jpg" onclick="changeImage('img1', this.src)">
        <img src="https://i.ibb.co/NdWKzZxp/IMG-4704.jpg" onclick="changeImage('img1', this.src)">
        <img src="https://i.ibb.co/Y4FFJVr0/IMG-4705.jpg" onclick="changeImage('img1', this.src)">
      </div>

      <h3>Royal Blue Elegance</h3>
      <p class="price">₹4,999</p>

      <a class="btn" href="https://wa.me/919633789718?text=Hi%20I%20want%20Royal%20Blue%20Elegance">
        Order on WhatsApp
      </a>

    </div>

  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <p>© 2026 House of Ananda</p>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <span class="close" onclick="closePopup()">×</span>
  <span class="nav left" onclick="prevImage()">❮</span>
  <img id="popupImg">
  <span class="nav right" onclick="nextImage()">❯</span>
</div>

<script>

let images1 = [
  "https://i.ibb.co/mVFRRMPH/IMG-4703.jpg",
  "https://i.ibb.co/NdWKzZxp/IMG-4704.jpg",
  "https://i.ibb.co/Y4FFJVr0/IMG-4705.jpg"
];

let currentImages = [];
let currentIndex = 0;

function openPopup(src, images) {
  currentImages = images;
  currentIndex = images.indexOf(src);
  document.getElementById("popup").style.display = "flex";
  document.getElementById("popupImg").src = src;
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

function nextImage() {
  currentIndex = (currentIndex + 1) % currentImages.length;
  document.getElementById("popupImg").src = currentImages[currentIndex];
}

function prevImage() {
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  document.getElementById("popupImg").src = currentImages[currentIndex];
}

function changeImage(id, src) {
  document.getElementById(id).src = src;
}

</script>

</body>
</html>
